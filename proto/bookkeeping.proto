syntax = "proto3";

package bookkeeping.v1;

// ============================================================
// Service
// ============================================================

service BookkeepingService {
  // Deposit
  rpc CreateDeposit(DepositRequest) returns (JournalTransactionResponse);
  rpc ConfirmDeposit(DepositRequest) returns (JournalTransactionResponse);

  // Withdraw
  rpc CreateWithdrawal(WithdrawRequest) returns (JournalTransactionResponse);
  rpc AdvanceWithdrawal(AdvanceWithdrawalRequest) returns (JournalTransactionResponse);

  // Stake
  rpc CreateStake(StakeRequest) returns (JournalTransactionResponse);
  rpc Unstake(UnstakeRequest) returns (JournalTransactionResponse);

  // Ops / scaling: standard readiness probe for load balancers.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ============================================================
// Shared messages
// ============================================================

message AssetBookDescriptor {
  int32 client_id = 1;
  int32 account_id = 2;
  int32 asset_id = 3;
  int32 asset_type_id = 4;
  string asset_ticker = 5;
  int32 wallet_type_id = 6;
  optional string address = 7;
}

message JournalTransactionResponse {
  int32 id = 1;
  string uuid_token = 2;
  optional string idempotency_token = 3;
  optional int32 transaction_type_id = 4;
  optional int32 transaction_state_id = 5;
  string journal_transaction_state = 6;
  optional string transaction_hash = 7;
}

// ============================================================
// Deposit
// ============================================================

message DepositRequest {
  string idempotency_token = 1;
  string uuid_token = 2;
  // Số nguyên dạng chuỗi (giữ nguyên precision, không đi qua double/float).
  string amount = 3;
  optional string transaction_hash = 4;
  optional int32 created_by = 5;
  // ISO-8601, vd "2026-09-27T10:00:00Z".
  string business_post_date_time = 6;
  AssetBookDescriptor amount_asset = 7;
  optional int32 to_account_id = 8;
}

// ============================================================
// Withdraw
// ============================================================

enum WithdrawKind {
  WITHDRAW_KIND_UNSPECIFIED = 0;
  EXTERNAL = 1;
  INTERNAL = 2;
}

enum WithdrawTargetState {
  WITHDRAW_TARGET_STATE_UNSPECIFIED = 0;
  AUTHORIZED = 1;
  SENT = 2;
  CONFIRMING = 3;
  CONFIRMED = 4;
}

message WithdrawRequest {
  string idempotency_token = 1;
  string uuid_token = 2;
  string amount = 3;
  string fee = 4;
  optional string transaction_hash = 5;
  optional int32 created_by = 6;
  string business_post_date_time = 7;
  AssetBookDescriptor amount_asset = 8;
  // Nếu không truyền, feeAsset mặc định = amount_asset.
  optional AssetBookDescriptor fee_asset = 9;
  int32 from_account_id = 10;
  WithdrawKind kind = 11;
}

message AdvanceWithdrawalRequest {
  int32 journal_transaction_id = 1;
  WithdrawTargetState target_state = 2;
  WithdrawKind kind = 3;
  optional string transaction_hash = 4;
  optional int32 updated_by = 5;
}

// ============================================================
// Stake
// ============================================================

message StakeRequest {
  string idempotency_token = 1;
  string uuid_token = 2;
  string amount = 3;
  optional string transaction_hash = 4;
  optional int32 created_by = 5;
  string business_post_date_time = 6;
  AssetBookDescriptor amount_asset = 7;
  optional int32 custody_account_id = 8;
}

message UnstakeRequest {
  int32 journal_transaction_id = 1;
  string staked_amount = 2;
  optional int32 updated_by = 3;
}

// ============================================================
// Health
// ============================================================

message HealthCheckRequest {}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
